<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Estación · Renaico & Instituto</title>

  <!-- Prevención de parpadeo de tema y fuente -->
  <script>
    try {
      var t = localStorage.getItem('estacion_tema') || 'dark';
      var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      var f = localStorage.getItem('estacion_fuente_titulos') || 'fraunces';
      var F = {
        fraunces: "'Fraunces', Georgia, serif",
        jakarta: "'Plus Jakarta Sans', system-ui, sans-serif",
        fira: "'Fira Sans', system-ui, sans-serif",
        chivo: "'Chivo', system-ui, sans-serif",
        space: "'Space Grotesk', system-ui, sans-serif"
      };
      if (F[f]) document.documentElement.style.setProperty('--font-title', F[f]);
    } catch (e) {}
  </script>

  <!-- Íconos de pantalla de inicio móvil (Evita el recuadro gris de Chrome) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cd6'/%3E%3Cstop offset='1' stop-color='%23d4af37'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle'%3E🏡%3C/text%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cd6'/%3E%3Cstop offset='1' stop-color='%23d4af37'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle'%3E🏡%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0d13" id="metaThemeColor">

  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;800&family=Fira+Sans:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;700;800&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ─── Variables de Color y Diseño ─── */
    :root {
      --font-title: 'Fraunces', Georgia, serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      
      /* Modo Claro (Paleta Cálida Marfil / Crema) */
      --bg: #fbf5ee;
      --card: #fffdf9;
      --card-elevated: #f4ecdf;
      --border: #eadfd2;
      --text: #3b2a22;
      --muted: #7a685d;
      --p: #7c5cd6;
      --p-soft: #ece6fb;
      --gold: #b38600;
      --gold-soft: #fff6d9;
      --emerald: #059669;
      --emerald-soft: #d1fae5;
      --rose: #be185d;
      --rose-soft: #fce7f3;
      --shadow: 0 1px 3px rgba(80,50,30,.06), 0 8px 22px rgba(80,50,30,.08);
      --scrim: rgba(40, 25, 15, 0.55);
    }

    [data-theme="dark"] {
      /* Modo Oscuro (Luxury Dark) */
      --bg: #0e0d13;
      --card: #171520;
      --card-elevated: #1f1c2b;
      --border: #2c273d;
      --text: #f3eef8;
      --muted: #948a9f;
      --p: #9d7cd8;
      --p-soft: #2b2445;
      --gold: #d4af37;
      --gold-soft: #f5deb3;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.16);
      --rose: #e08ca3;
      --rose-soft: rgba(224, 140, 163, 0.16);
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.45);
      --scrim: rgba(0, 0, 0, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 14px 14px 110px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .font-title {
      font-family: var(--font-title), Georgia, serif !important;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    /* ─── Cabecera Principal ─── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 14px;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .top-icon {
      font-size: 1.8rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .top-titles h1 {
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }
    .top-titles p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      position: relative;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .icon-btn:active { transform: scale(0.93); }
    .icon-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--card-elevated);
    }

    /* Menú desplegable 'Aa' Fuentes */
    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 48px;
      width: 220px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 6px;
      z-index: 60;
      display: none;
    }
    .dropdown-menu.open { display: block; }
    .dropdown-header {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 6px 12px 4px;
    }
    .font-btn {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .font-btn:hover { background: var(--card-elevated); }
    .font-btn.active {
      background: var(--p-soft);
      color: var(--p);
    }

    /* ─── Barra de Búsqueda ─── */
    .search-wrap {
      margin-bottom: 12px;
      position: sticky;
      top: 8px;
      z-index: 25;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 15px;
      padding: 9px 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
    }
    .search-clear {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px 4px;
      display: none;
    }
    .search-box.has-val .search-clear { display: block; }

    /* ─── Barra de Progreso de Empaque (Renaico) ─── */
    .packing-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .packing-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .packing-bar-bg {
      width: 100%;
      height: 7px;
      background: var(--card-elevated);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .packing-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.3s ease;
    }
    .packing-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-size: 0.72rem;
    }
    .packing-reset {
      border: none;
      background: none;
      color: var(--emerald);
      font-weight: 700;
      font-size: 0.74rem;
      cursor: pointer;
    }

    /* ─── Acordeón de Categorías ─── */
    .cat-accordion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.15s ease;
    }
    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--card);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .cat-header:hover { background: var(--card-elevated); }
    .cat-title-text {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-badge-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-counter {
      font-size: 0.72rem;
      font-family: monospace;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 700;
    }
    .cat-arrow {
      font-size: 0.72rem;
      color: var(--muted);
      transition: transform 0.2s ease;
    }
    .cat-accordion.open .cat-arrow {
      transform: rotate(180deg);
      color: var(--gold);
    }
    .cat-content {
      display: none;
      padding: 4px 10px 10px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }
    .cat-accordion.open .cat-content {
      display: block;
    }

    /* ─── Filas de Tareas / Elementos (Minimalistas) ─── */
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.1);
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.12s;
    }
    .task-row:hover { background: var(--card-elevated); }
    .task-row:last-child { border-bottom: none; }

    .task-checkbox {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      color: transparent;
      font-size: 0.75rem;
      font-weight: 800;
      transition: all 0.15s ease;
    }
    .task-checkbox.checked {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }
    .task-title {
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }
    .task-title.done {
      text-decoration: line-through;
      opacity: 0.55;
    }
    .task-summary-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.22);
      font-weight: 600;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    [data-theme="dark"] .task-summary-pill {
      background: rgba(212, 175, 55, 0.1);
    }

    .task-arrow {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 1px;
      flex-shrink: 0;
    }

    /* ─── Botón Flotante y Barra Inferior ─── */
    .fab {
      position: fixed;
      z-index: 30;
      right: max(16px, calc(50% - 240px));
      bottom: calc(76px + env(safe-area-inset-bottom));
      height: 50px;
      padding: 0 18px;
      border-radius: 16px;
      background: var(--p);
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.14s ease;
    }
    .fab:active { transform: scale(0.95); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    }
    .bottom-nav-inner {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .nav-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 14px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .nav-tab-btn.active {
      background: var(--p-soft);
      border-color: var(--p);
      color: var(--p);
    }

    /* ─── Modales Emergentes Centrados ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      transform: scale(0.94);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }
    .modal-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-field {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .modal-field label {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .modal-field p {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.45;
      white-space: pre-line;
      word-break: break-word;
    }

    /* Formularios */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.74rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .form-input, .form-select, .form-area {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      color: var(--text);
      background: var(--bg);
    }
    .form-area { min-height: 84px; resize: vertical; line-height: 1.4; }
    .form-input:focus, .form-select:focus, .form-area:focus {
      border-color: var(--gold);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 9px 16px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      transition: transform 0.12s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--p); color: #fff; }
    .btn-secondary { background: var(--bg); border: 1.5px solid var(--border); color: var(--text); }
    .btn-danger { color: var(--rose); border: 1px solid var(--border); background: var(--bg); }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translate(-50%, -20px);
      opacity: 0;
      pointer-events: none;
      background: var(--text);
      color: var(--bg);
      padding: 9px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 200;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Barra Superior -->
    <header class="top-bar">
      <div class="top-left">
        <span class="top-icon" id="headerIcon">🏡</span>
        <div class="top-titles">
          <h1 class="font-title" id="headerTitle">Traslado a Renaico</h1>
          <p id="headerSubtitle">Resumen & detalle para no olvidar nada</p>
        </div>
      </div>

      <div class="top-actions">
        <!-- Toggle Modo Claro / Oscuro -->
        <button class="icon-btn" id="btnThemeToggle" title="Cambiar tema (Claro/Oscuro)">☀️</button>
        <!-- Selector Tipográfico 'Aa' -->
        <button class="icon-btn" id="btnFontToggle" title="Letra de los títulos">Aa</button>
        <!-- Menú de Respaldos -->
        <button class="icon-btn" id="btnExport" title="Respaldar JSON">💾</button>
        <button class="icon-btn" id="btnImport" title="Cargar JSON">📂</button>
        <input type="file" id="fileInput" style="display:none" accept=".json">

        <!-- Menú flotante de fuentes -->
        <div class="dropdown-menu" id="fontDropdown">
          <div class="dropdown-header">Letra de los títulos</div>
          <button class="font-btn" onclick="setFont('fraunces')" style="font-family:'Fraunces', serif;">
            <span>Fraunces (serif)</span><span class="check" id="chk-fraunces">✓</span>
          </button>
          <button class="font-btn" onclick="setFont('jakarta')" style="font-family:'Plus Jakarta Sans', sans-serif;">
            <span>Plus Jakarta</span><span class="check" id="chk-jakarta"></span>
          </button>
          <button class="font-btn" onclick="setFont('fira')" style="font-family:'Fira Sans', sans-serif;">
            <span>Fira Sans</span><span class="check" id="chk-fira"></span>
          </button>
          <button class="font-btn" onclick="setFont('chivo')" style="font-family:'Chivo', sans-serif;">
            <span>Chivo</span><span class="check" id="chk-chivo"></span>
          </button>
          <button class="font-btn" onclick="setFont('space')" style="font-family:'Space Grotesk', sans-serif;">
            <span>Space Grotesk</span><span class="check" id="chk-space"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Barra de Búsqueda -->
    <div class="search-wrap">
      <div class="search-box" id="searchBoxContainer">
        <span>🔎</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar tarea, apunte, cable o tip..." autocomplete="off">
        <button class="search-clear" id="btnSearchClear">✕</button>
      </div>
    </div>

    <!-- Barra de Progreso de Empaque (Modo Renaico) -->
    <section class="packing-card" id="packingCard">
      <div class="packing-head">
        <span style="color:var(--muted);display:flex;align-items:center;gap:6px;">
          <span style="width:7px;height:7px;border-radius:50%;background:var(--emerald);"></span>
          Equipaje empacado
        </span>
        <span id="packingPercent" style="color:var(--emerald);font-family:monospace;font-weight:800;">0% (0/0)</span>
      </div>
      <div class="packing-bar-bg">
        <div class="packing-bar-fill" id="packingBarFill" style="width: 0%;"></div>
      </div>
      <div class="packing-footer">
        <span style="color:var(--muted)">¿Preparando nuevo viaje?</span>
        <button class="packing-reset" id="btnResetPacking">🔄 Desmarcar todo para viajar</button>
      </div>
    </section>

    <!-- Herramientas de conteo -->
    <div class="tools" id="toolsBar">
      <span class="tot">Total en esta vista: <b id="totalItemsCount">0</b></span>
      <span style="font-size:0.72rem;color:var(--muted);">💡 Toca una fila para ver el detalle en el centro</span>
    </div>

    <!-- Contenedor dinámico de Categorías y Tareas -->
    <main id="mainContentArea"></main>

    <!-- Botón para añadir nueva categoría -->
    <div style="margin-top: 14px;">
      <button class="btn btn-secondary" style="width:100%;border-style:dashed;padding:10px;" id="btnAddCategory">
        ＋ Nueva categoría
      </button>
    </div>
  </div>

  <!-- Botón flotante ＋ Agregar Tarea -->
  <button class="fab" id="btnFabAdd">
    <span style="font-size:1.15rem;line-height:1">＋</span> Agregar
  </button>

  <!-- Barra de Navegación Inferior -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-tab-btn active" id="tabRenaico" onclick="switchSection('renaico')">
        <span>🏡</span>
        <span class="font-title">Renaico</span>
      </button>
      <button class="nav-tab-btn" id="tabInstituto" onclick="switchSection('instituto')">
        <span>🎓</span>
        <span class="font-title">Instituto</span>
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════
       VENTANA EMERGENTE EN EL MEDIO (DETALLE COMPLETO)
       ═══════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalDetail">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <span style="font-size:0.72rem;font-weight:700;color:var(--p);text-transform:uppercase;" id="detCatBadge">Categoría</span>
          <h3 class="font-title" style="font-size:1.18rem;margin-top:2px;" id="detTitle">Título de la Tarea</h3>
        </div>
        <button class="modal-close-btn" data-close>✕</button>
      </div>

      <div class="modal-field" id="detSummaryBox">
        <label>Resumen visible</label>
        <p id="detSummaryTxt"></p>
      </div>

      <div class="modal-field">
        <label>Detalle para no olvidar</label>
        <p id="detBodyTxt"></p>
      </div>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" style="flex:1;" id="detToggleCheck">✓ Marcar como lista</button>
        <button class="btn btn-danger" id="detDelete">🗑️</button>
      </div>
    </div>
  </div>

  <!-- Modal: Agregar / Editar Tarea -->
  <div class="modal-overlay" id="modalForm">
    <div class="modal-card">
      <div class="modal-head">
        <h3 class="font-title" style="font-size:1.18rem;" id="formModalTitle">Nueva Tarea</h3>
        <button class="modal-close-btn" data-close>✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Título principal *</label>
        <input type="text" id="inpTitle" class="form-input" placeholder="Ej: Computador y cargador...">
      </div>

      <div class="form-group">
        <label class="form-label">Resumen corto (visible en la lista)</label>
        <input type="text" id="inpSummary" class="form-input" placeholder="Ej: Cargador original, mouse y soporte...">
      </div>

      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select id="inpCategory" class="form-select"></select>
      </div>

      <div class="form-group">
        <label class="form-label">Detalle completo (aparece al tocar en el centro)</label>
        <textarea id="inpDetail" class="form-area" placeholder="Escribe los pasos, notas clave, precauciones o ubicaciones..."></textarea>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
        <button class="btn btn-secondary" data-close>Cancelar</button>
        <button class="btn btn-primary" id="btnSaveTask">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Crear Categoría -->
  <div class="modal-overlay" id="modalCategory">
    <div class="modal-card">
      <div class="modal-head">
        <h3 class="font-title" style="font-size:1.18rem;">Nueva Categoría</h3>
        <button class="modal-close-btn" data-close>✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Nombre de la categoría *</label>
        <input type="text" id="inpCatName" class="form-input" placeholder="Ej: Ropa, Medicamentos, Certámenes...">
      </div>

      <div class="form-group" id="groupPackingCheckbox" style="display:none;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.8rem;color:var(--text)">
          <input type="checkbox" id="inpCatPacking" style="width:16px;height:16px;accent-color:var(--emerald);">
          <span>Cuenta para la barra de equipaje empacado</span>
        </label>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
        <button class="btn btn-secondary" data-close>Cancelar</button>
        <button class="btn btn-primary" id="btnSaveCategory">Crear</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Acción guardada</div>

  <script>
    /* ─── DATOS INICIALES Y CONSTANTES ─── */
    const KEY_DATA = 'estacion_detallada_data';
    const KEY_CATS = 'estacion_categorias';
    const KEY_THEME = 'estacion_tema';
    const KEY_FONT = 'estacion_fuente_titulos';

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const vibrar = () => { if (navigator.vibrate) try { navigator.vibrate(8); } catch(e){} };

    let toastTimer;
    function toast(text) {
      const el = $('#toastMsg');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    /* Datos reales completos por defecto */
    const DEFAULT_DATA = {
      renaico: [
        { id: 'r1', cat: 'llevar_tec', title: 'Computador y estación de trabajo', summary: 'Cargador original, mouse y soporte', detail: '• Revisar cargador de alta potencia (no dejar el transformador en el enchufe).\n• Mouse inalámbrico + pila de repuesto.\n• Reposa muñeca ergonómico.\n• Dongle o conector USB multipuertos.\n• Audífonos bluetooth con estuche cargado.', checked: true },
        { id: 'r2', cat: 'llevar_tec', title: 'Cargadores y periféricos de celular', summary: 'Cables USB-C, adaptadores y apoya teléfono', detail: '• Llevar soporte para ver clases o videos sin cansancio de cuello.\n• Al menos 2 cables USB-C en buen estado.\n• Bloque de carga rápida para la noche.', checked: true },
        { id: 'r3', cat: 'llevar_skin', title: 'Rutina básica de Skincare', summary: 'Limpiador, hidratante y bloqueador solar', detail: '• Limpiador facial suave (envase bien cerrado para no derramar en la mochila).\n• Crema hidratante facial para el cambio de clima.\n• Bloqueador solar factor 50 (muy importante para reaplicar en el día).\n• Bálsamo labial o serum nocturno.', checked: true },
        { id: 'r4', cat: 'llevar_skin', title: 'Neceser de aseo y cuidado personal', summary: 'Cepillo, toalla de mano y artículos diarios', detail: '• Cepillo de dientes con protector.\n• Pasta dental de viaje.\n• Desodorante y peine de pelo.\n• Gotitas para ojos o medicamentos de rutina si hacen falta.', checked: false },
        { id: 'r5', cat: 'llevar_mat', title: 'Cuadernos y estuche universitario', summary: 'Cuaderno principal, destacadores y post-its', detail: '• Cuaderno de apuntes principal con materias del semestre.\n• Destacadores pasteles y bolígrafos negros/azules.\n• Notas adhesivas (post-its) para marcar lecturas o páginas clave.', checked: true },
        { id: 'r6', cat: 'ya_en_renaico', title: 'Secador de pelo & plancha', summary: 'Guardado en el clóset de la pieza', detail: 'No empacar desde la casa principal porque ya quedó uno listo y operativo en Renaico.', checked: true },
        { id: 'r7', cat: 'ya_en_renaico', title: 'Ropa abrigada de reserva', summary: 'Chalecos, pantuflas y almohada', detail: 'Están en el ropero de la habitación. Solo llevar ropa para la cantidad exacta de días que dura la estadía.', checked: true },
        { id: 'r8', cat: 'pendientes_alla', title: 'Revisar PC de la Junaeb', summary: 'Buscar cuaderno de telecomunicaciones', detail: 'Encender el PC, revisar la carpeta de descargas y documentos para rescatar apuntes anteriores y guías del ramo.', checked: true },
        { id: 'r9', cat: 'pendientes_alla', title: 'Organizar apuntes y sincronizar Drive', summary: 'Limpiar descargas y ordenar carpetas', detail: 'Aprovechar la calma para ordenar archivos por materia y verificar que todo esté respaldado en la nube.', checked: false },
        { id: 'r10', cat: 'comprar_alla', title: 'Caja organizadora plástica', summary: 'Para ordenar cables y útiles en Renaico', detail: 'Comprar en bazar o supermercado local para dejar un rincón fijo de estudio sin cables enredados.', checked: false }
      ],
      instituto: [
        { id: 'i1', cat: 'estudio', title: 'Bloques de enfoque: 45 min estudio / 15 min descanso', summary: '1 o 2 bloques diarios por ramo difícil', detail: '• Poner temporizador visible (sin mirar notificaciones de redes sociales).\n• Durante los 45m: solo un tema específico.\n• En los 15m de descanso: pararse, tomar agua o caminar (no quedarse pegada en la pantalla).', checked: false },
        { id: 'i2', cat: 'estudio', title: 'Técnica de Pizarra / Explicación activa', summary: 'Explicar conceptos en voz alta o diagramar', detail: '• Escribir mapas mentales en pizarra o cuaderno borrador.\n• Explicar la materia como si se la enseñaras a alguien que no sabe nada.\n• Si te trabas en una parte, ahí está el vacío que hay que releer.', checked: false },
        { id: 'i3', cat: 'estudio', title: 'Resúmenes semanales compactos', summary: 'No dejar acumular para la semana de prueba', detail: 'Dedicar 30 minutos los viernes o domingos a resumir las ideas clave de cada clase de la semana.', checked: false },
        { id: 'i4', cat: 'evaluaciones', title: 'Sueño reparador pre-prueba', summary: 'Dormir mínimo 7h 30m la noche anterior', detail: 'Estudiar de noche sin dormir sabotea la memoria de trabajo. Dormir fija los conceptos en el cerebro.', checked: false },
        { id: 'i5', cat: 'evaluaciones', title: 'Protocolo de estudio con 3 días de anticipación', summary: 'Simulacros y ejercicios tipo certamen', detail: '• Día 3 antes: Repaso de conceptos y fórmulas.\n• Día 2 antes: Resolver guías y exámenes de años anteriores sin mirar respuestas.\n• Día 1 antes: Repaso ligero y descanso mental temprano.', checked: false },
        { id: 'i6', cat: 'estructura', title: 'Descarga y análisis de programas de ramos', summary: 'Ponderaciones de tests, certámenes y talleres', detail: 'Anotar en el calendario qué porcentaje vale cada evaluación y los requisitos de asistencia o eximición.', checked: true },
        { id: 'i7', cat: 'estructura', title: 'Creación de carpetas dedicadas en Drive', summary: '1 carpeta por asignatura con guías y lecturas', detail: 'Estructura recomendada: /Semestre -> /Nombre Ramo -> /Guías, /Apuntes, /Evaluaciones.', checked: true },
        { id: 'i8', cat: 'toma_ramos', title: 'Verificación de prelaciones (ramos requisito)', summary: 'Asegurar continuidad de la malla', detail: 'Revisar qué asignaturas abren los ramos clave del próximo semestre para priorizar sus cupos primero.', checked: true },
        { id: 'i9', cat: 'toma_ramos', title: 'Plan A y Plan B de horarios y secciones', summary: 'Evitar topes y ventanas excesivas', detail: 'Tener pre-armados dos horarios alternativos con los códigos de sección por si la primera opción se agota.', checked: true }
      ]
    };

    const DEFAULT_CATS = {
      renaico: [
        { key: 'llevar_tec', name: 'Tecnológico & Cables', packing: true },
        { key: 'llevar_skin', name: 'Skincare & Aseo', packing: true },
        { key: 'llevar_mat', name: 'Material & Cuadernos', packing: true },
        { key: 'ya_en_renaico', name: 'Ya está en Renaico (No empacar)', packing: false },
        { key: 'pendientes_alla', name: 'Pendientes mientras estoy allá', packing: false },
        { key: 'comprar_alla', name: 'Comprar allá y ubicar', packing: false }
      ],
      instituto: [
        { key: 'estudio', name: 'Enfoque & Hábitos de Estudio', packing: false },
        { key: 'evaluaciones', name: 'Evaluaciones & Bienestar', packing: false },
        { key: 'estructura', name: 'Estructura & Organización', packing: false },
        { key: 'toma_ramos', name: 'Toma de Ramos & Planificación', packing: false }
      ]
    };

    let appData = JSON.parse(localStorage.getItem(KEY_DATA) || 'null') || DEFAULT_DATA;
    let catData = JSON.parse(localStorage.getItem(KEY_CATS) || 'null') || DEFAULT_CATS;

    let currentSection = 'renaico';
    let searchQuery = '';
    let openCats = { llevar_tec: true, estudio: true }; // Primeras abiertas por comodidad
    let selectedDetailId = null;

    function saveAll() {
      localStorage.setItem(KEY_DATA, JSON.stringify(appData));
      localStorage.setItem(KEY_CATS, JSON.stringify(catData));
      updatePackingProgress();
    }

    /* ─── TEMA CLARO / OSCURO ─── */
    function applyTheme(themeName) {
      document.documentElement.dataset.theme = themeName;
      localStorage.setItem(KEY_THEME, themeName);
      const isDark = themeName === 'dark';
      $('#btnThemeToggle').textContent = isDark ? '☀️' : '🌙';
      $('#metaThemeColor').setAttribute('content', isDark ? '#0e0d13' : '#fbf5ee');
    }

    $('#btnThemeToggle').onclick = () => {
      vibrar();
      const current = document.documentElement.dataset.theme;
      applyTheme(current === 'dark' ? 'light' : 'dark');
      toast(document.documentElement.dataset.theme === 'dark' ? 'Modo Oscuro' : 'Modo Claro');
    };

    /* ─── SELECTOR TIPOGRÁFICO 'Aa' ─── */
    const FONTS = {
      fraunces: "'Fraunces', Georgia, serif",
      jakarta: "'Plus Jakarta Sans', system-ui, sans-serif",
      fira: "'Fira Sans', system-ui, sans-serif",
      chivo: "'Chivo', system-ui, sans-serif",
      space: "'Space Grotesk', system-ui, sans-serif"
    };

    function setFont(key) {
      localStorage.setItem(KEY_FONT, key);
      const val = FONTS[key] || FONTS.fraunces;
      document.documentElement.style.setProperty('--font-title', val);
      
      // Actualizar marcas en menú
      Object.keys(FONTS).forEach(k => {
        const el = $(`#chk-${k}`);
        if (el) el.textContent = k === key ? '✓' : '';
      });
      $('#fontDropdown').classList.remove('open');
      toast('Letra actualizada');
    }

    $('#btnFontToggle').onclick = e => {
      e.stopPropagation();
      $('#fontDropdown').classList.toggle('open');
    };
    document.addEventListener('click', () => $('#fontDropdown').classList.remove('open'));

    /* ─── PESTAÑAS RENAICO / INSTITUTO ─── */
    function switchSection(sec) {
      currentSection = sec;
      const isRen = sec === 'renaico';

      $('#tabRenaico').classList.toggle('active', isRen);
      $('#tabInstituto').classList.toggle('active', !isRen);

      $('#headerIcon').textContent = isRen ? '🏡' : '🎓';
      $('#headerTitle').textContent = isRen ? 'Traslado a Renaico' : 'Instituto & Estrategia';
      $('#headerSubtitle').textContent = isRen ? 'Resumen & detalle para no olvidar nada' : 'Guía paso a paso y métodos de estudio';

      $('#packingCard').style.display = isRen ? 'block' : 'none';
      render();
    }

    /* ─── RENDERIZADO ─── */
    function getCategories() {
      return catData[currentSection] || [];
    }

    function isPacking(catKey) {
      const c = catData.renaico.find(x => x.key === catKey);
      return !!(c && c.packing);
    }

    function updatePackingProgress() {
      const list = appData.renaico.filter(it => isPacking(it.cat));
      const total = list.length;
      const packed = list.filter(it => it.checked).length;
      const percent = total > 0 ? Math.round((packed / total) * 100) : 0;

      $('#packingPercent').textContent = `${percent}% (${packed}/${total})`;
      $('#packingBarFill').style.width = `${percent}%`;
    }

    function toggleCategoryAccordion(key) {
      vibrar();
      openCats[key] = !openCats[key];
      render();
    }

    function render() {
      const q = norm(searchQuery);
      const isSearching = q.length > 0;
      const categories = getCategories();
      const items = appData[currentSection] || [];

      let totalVisibles = 0;
      let html = '';

      categories.forEach(cat => {
        let catItems = items.filter(x => x.cat === cat.key);

        if (isSearching) {
          catItems = catItems.filter(x => 
            norm(x.title).includes(q) || 
            norm(x.summary).includes(q) || 
            norm(x.detail).includes(q)
          );
        }

        totalVisibles += catItems.length;
        const isOpen = isSearching || !!openCats[cat.key];
        const doneCount = catItems.filter(x => x.checked).length;

        html += `
          <div class="cat-accordion ${isOpen ? 'open' : ''}">
            <div class="cat-header" onclick="toggleCategoryAccordion('${cat.key}')">
              <span class="cat-title-text font-title">
                ${esc(cat.name)}
              </span>
              <div class="cat-badge-wrap">
                <span class="cat-counter">${doneCount}/${catItems.length}</span>
                <span class="cat-arrow">▼</span>
              </div>
            </div>
            <div class="cat-content">
              ${catItems.length === 0 ? `
                <div style="font-size:0.75rem;color:var(--muted);font-style:italic;text-align:center;padding:12px 0;">
                  No hay tareas registradas aquí.
                </div>
              ` : catItems.map(it => `
                <div class="task-row" onclick="openDetailModal('${it.id}')">
                  <button class="task-checkbox ${it.checked ? 'checked' : ''}" onclick="toggleItemCheck('${it.id}', event)">
                    ${it.checked ? '✓' : ''}
                  </button>
                  <div class="task-body">
                    <div class="task-title ${it.checked ? 'done' : ''}">${esc(it.title)}</div>
                    ${it.summary ? `<div class="task-summary-pill"><span>📌</span><span>${esc(it.summary)}</span></div>` : ''}
                  </div>
                  <span class="task-arrow">›</span>
                </div>
              `).join('')}
              <div style="display:flex;justify-content:flex-end;margin-top:6px;">
                <button onclick="confirmDeleteCat('${cat.key}')" style="font-size:0.72rem;color:var(--rose);background:none;border:none;cursor:pointer;padding:4px 6px;">
                  Eliminar categoría
                </button>
              </div>
            </div>
          </div>
        `;
      });

      $('#totalItemsCount').textContent = totalVisibles;
      $('#mainContentArea').innerHTML = html;
      updatePackingProgress();
    }

    /* ─── MODAL DE DETALLE EN EL CENTRO ─── */
    function openDetailModal(id) {
      vibrar();
      selectedDetailId = id;
      const it = (appData[currentSection] || []).find(x => x.id === id);
      if (!it) return;

      const cat = getCategories().find(c => c.key === it.cat);
      $('#detCatBadge').textContent = cat ? cat.name : 'Elemento';
      $('#detTitle').textContent = it.title;
      
      const sBox = $('#detSummaryBox');
      if (it.summary) {
        sBox.style.display = 'block';
        $('#detSummaryTxt').textContent = it.summary;
      } else {
        sBox.style.display = 'none';
      }

      $('#detBodyTxt').textContent = it.detail || 'Sin especificaciones ni pasos detallados.';
      
      const btnCheck = $('#detToggleCheck');
      btnCheck.textContent = it.checked ? '↩︎ Desmarcar tarea' : '✓ Marcar como lista';
      btnCheck.className = it.checked ? 'btn btn-secondary' : 'btn btn-primary';

      $('#modalDetail').classList.add('active');
    }

    $('#detToggleCheck').onclick = () => {
      if (!selectedDetailId) return;
      toggleItemCheck(selectedDetailId);
      openDetailModal(selectedDetailId); // Refresca botones
    };

    $('#detDelete').onclick = () => {
      if (!selectedDetailId) return;
      if (confirm('¿Eliminar esta tarea definitivamente?')) {
        appData[currentSection] = appData[currentSection].filter(x => x.id !== selectedDetailId);
        saveAll();
        closeModals();
        render();
        toast('Tarea eliminada');
      }
    };

    function toggleItemCheck(id, e) {
      if (e) e.stopPropagation();
      const it = (appData[currentSection] || []).find(x => x.id === id);
      if (it) {
        vibrar();
        it.checked = !it.checked;
        saveAll();
        render();
      }
    }

    /* ─── FORMULARIO: NUEVA TAREA ─── */
    function openAddTaskModal() {
      const cats = getCategories();
      if (!cats.length) {
        alert('Crea primero una categoría para esta sección.');
        return;
      }

      $('#inpCategory').innerHTML = cats.map(c => `<option value="${c.key}">${esc(c.name)}</option>`).join('');
      $('#inpTitle').value = '';
      $('#inpSummary').value = '';
      $('#inpDetail').value = '';

      $('#modalForm').classList.add('active');
      setTimeout(() => $('#inpTitle').focus(), 150);
    }

    $('#btnFabAdd').onclick = openAddTaskModal;

    $('#btnSaveTask').onclick = () => {
      const title = $('#inpTitle').value.trim();
      if (!title) return alert('Ingresa al menos el título de la tarea');

      vibrar();
      const newTask = {
        id: 'usr_' + Date.now().toString(36),
        cat: $('#inpCategory').value,
        title: title,
        summary: $('#inpSummary').value.trim(),
        detail: $('#inpDetail').value.trim(),
        checked: false
      };

      appData[currentSection].unshift(newTask);
      saveAll();
      closeModals();
      render();
      toast('Tarea guardada');
    };

    /* ─── CREAR Y ELIMINAR CATEGORÍAS ─── */
    $('#btnAddCategory').onclick = () => {
      $('#inpCatName').value = '';
      $('#inpCatPacking').checked = false;
      $('#groupPackingCheckbox').style.display = currentSection === 'renaico' ? 'block' : 'none';
      $('#modalCategory').classList.add('active');
      setTimeout(() => $('#inpCatName').focus(), 150);
    };

    $('#btnSaveCategory').onclick = () => {
      const name = $('#inpCatName').value.trim();
      if (!name) return alert('Ingresa un nombre para la categoría');

      vibrar();
      const newCat = {
        key: 'cat_' + Date.now().toString(36),
        name: name,
        packing: currentSection === 'renaico' && $('#inpCatPacking').checked
      };

      catData[currentSection].push(newCat);
      openCats[newCat.key] = true;
      saveAll();
      closeModals();
      render();
      toast('Categoría creada');
    };

    function confirmDeleteCat(key) {
      const cat = getCategories().find(c => c.key === key);
      if (!cat) return;
      const count = (appData[currentSection] || []).filter(x => x.cat === key).length;
      if (confirm(`¿Eliminar la categoría "${cat.name}" y sus ${count} elemento(s)?`)) {
        vibrar();
        catData[currentSection] = catData[currentSection].filter(c => c.key !== key);
        appData[currentSection] = appData[currentSection].filter(x => x.cat !== key);
        saveAll();
        render();
        toast('Categoría eliminada');
      }
    }

    /* ─── RESET EMPACADO ─── */
    $('#btnResetPacking').onclick = () => {
      if (confirm('¿Desmarcar todo el equipaje para iniciar un nuevo viaje a Renaico?')) {
        vibrar();
        appData.renaico.forEach(it => {
          if (isPacking(it.cat)) it.checked = false;
        });
        saveAll();
        render();
        toast('Checklist reiniciado para viajar');
      }
    };

    /* ─── BÚSQUEDA ─── */
    $('#searchInput').addEventListener('input', e => {
      searchQuery = e.target.value;
      $('#searchBoxContainer').classList.toggle('has-val', searchQuery.length > 0);
      render();
    });

    $('#btnSearchClear').onclick = () => {
      $('#searchInput').value = '';
      searchQuery = '';
      $('#searchBoxContainer').classList.remove('has-val');
      render();
    };

    /* ─── RESPALDOS JSON ─── */
    $('#btnExport').onclick = () => {
      vibrar();
      const payload = {
        appData,
        catData,
        exportDate: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `respaldo-estacion-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      toast('Respaldo descargado');
    };

    $('#btnImport').onclick = () => $('#fileInput').click();

    $('#fileInput').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed.appData && parsed.catData) {
            appData = parsed.appData;
            catData = parsed.catData;
          } else if (parsed.renaico && parsed.instituto) {
            appData = parsed;
          } else {
            throw 0;
          }
          saveAll();
          render();
          toast('Respaldo cargado con éxito');
        } catch (err) {
          alert('El archivo no parece ser un respaldo válido.');
        }
        e.target.value = '';
      };
      r.readAsText(file);
    };

    /* ─── CONTROL DE MODALES ─── */
    function closeModals() {
      $$('.modal-overlay').forEach(m => m.classList.remove('active'));
      selectedDetailId = null;
    }

    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal-overlay') || e.target.closest('[data-close]')) {
        closeModals();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModals();
    });

    /* ─── INICIALIZACIÓN ─── */
    const savedTheme = localStorage.getItem(KEY_THEME) || 'dark';
    applyTheme(savedTheme);

    const savedFont = localStorage.getItem(KEY_FONT) || 'fraunces';
    setFont(savedFont);

    render();
  </script>
</body>
</html>
